# A persona is a hidden profile shape. The persona NAME stays in the private ground-truth folder and is
# NEVER written into candidate JSON. The `disability` block IS written, but only into the copy sent to M1.
#
# abilities  : per-domain range on a 0-1 scale. 0 = lowest possible answer for that domain, 1 = highest.
#              The generator draws a random value inside the range for each listed domain.
#              Any domain NOT listed uses the normal population draw (average about 0.7).
#              Reference points: 0.0-0.15 = almost no ability, 0.2-0.4 = strongly reduced,
#              0.4-0.6 = moderately reduced, 0.6-0.8 = near normal.
# cats       : probability of choosing mobility / office / both for this persona
# at_needs   : [[alternative lists], probability]. One list is drawn if the probability hits, else empty.
# disability : alternatives, one is drawn. types is a fixed list: physical_mobility | visual
# Domains    : lifting walking standing posture sitting dexterity vision communication cognitive endurance
# Phase 1 scope: mobility disabilities (limb loss, paralysis, tremor, neuromuscular, etc.) and visual impairment.
# ASSUMPTION: ranges are rough judgement, not clinical data. Have someone with domain knowledge review them.
# Severity varies a lot within one condition (MS especially). A wider range means more variation.


wheelchair_user_lower_body:              # legs affected, arms and hands work normally
  weight: 0.10
  abilities:
    walking:  [0.00, 0.15]
    standing: [0.00, 0.20]
    posture:  [0.30, 0.60]
    lifting:  [0.45, 0.75]
  cats: {mobility: 0.10, office: 0.70, both: 0.20}
  at_needs: [[[wheelchair]], 1.0]
  input_methods: [[keyboard, pointer, touch]]
  usable_formats: [[visual]]
  channels: [[spoken, written]]
  disability:
    - {types: [physical_mobility], description: "Spinal cord injury with paraplegia"}
    - {types: [physical_mobility], description: "Spina bifida"}
    - {types: [physical_mobility], description: "Paralysis of the legs after polio"}
  past_occupations:
    - administrative assistant
    - customer service representative
    - data entry clerk
    - accounting clerk

