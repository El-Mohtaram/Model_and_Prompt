# Occupation templates. The vocabulary is HAND-WRITTEN in an ESCO style. It is a placeholder:
# replace or extend it with a real ESCO export, and anchor intensity/physical with O*NET ratings.
#
# intensity : 0-1, how demanding the job is on the scaled demands (0.75 = heavy, 0.4 = light)
# physical  : 0-3, used so a candidate's work history never contradicts their abilities
# skills    : [recognized name, [synonyms], "duty sentence that PARAPHRASES the skill, never repeats it"]

general_skills:
  - ["communication", ["verbal communication", "communicating clearly"], "Keep colleagues and customers informed in a clear and friendly way"]
  - ["teamwork", ["team work", "working in a team"], "Work closely alongside the rest of the team to share the workload"]
  - ["time management", ["managing time", "prioritising tasks"], "Organise your own day so deadlines are met"]
  - ["attention to detail", ["accuracy", "being accurate"], "Check your own work carefully so errors are rare"]
  - ["problem solving", ["solving problems", "troubleshooting"], "Find sensible ways round small problems as they come up"]
  - ["reliability", ["punctuality", "dependable attendance"], "Turn up on time and be someone the team can count on"]

openings: ["We have a vacancy for a", "An opening is available for a", "Join our busy site as a", "A reliable person is needed for the role of", "Our growing organisation is hiring a"]
company_lines: ["Founded over fifteen years ago, we employ around 120 people across the Nile Delta and Greater Cairo.", "We are a family-run business with a friendly working atmosphere.", "Salary is paid monthly, with transport allowance and annual leave.", "Training is provided and uniform is supplied."]
employers: ["Al-Nour Trading Co.", "Delta Supplies", "Horizon Services", "Cairo Parcel Express", "Nile Retail Group", "Pyramid Office Solutions", "Sphinx Logistics", "Lotus Care Facilities"]

# Fields per template
#   type       : mobility | office | both
#   esco       : ESCO occupation name
#   onet       : {name, code, match}  match = exact | broad | approximate | none
#   levels     : 0-3 per demand. Only demands that apply to the type (D01 D02 D05 D07 mobility/both,
#                D04 office/both, D06 all). Higher level = harder. D06 = max(D04, D05).
#   est        : levels NOT backed by O*NET numbers (all = none are)
#   d08_p_no   : probability the route is NOT step-free
#   multi      : optional per-template overrides of option probabilities for multi-select demands
#   skip       : optional demands not generated for this job (e.g. no computer work)
#   skills     : ESCO essential -> importance essential, ESCO optional -> preferred

